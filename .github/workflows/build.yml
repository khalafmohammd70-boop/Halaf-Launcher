
name: Build Halaf Launcher APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "Project ZIP not found"
            exit 1
          fi

          mkdir -p /tmp/halaf-source
          unzip -q "$ZIP_FILE" -d /tmp/halaf-source

          PROJECT_DIR=$(dirname "$(find /tmp/halaf-source -name settings.gradle.kts -print -quit)")

          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "Gradle project not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-35
            build-tools;35.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Halaf-Launcher-APK
          path: /tmp/halaf-source/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
