
name: Build Halaf Launcher APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        run: |
          ZIP_FILE="./Halaf_Launcher_v0.4_step2_download.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "Project ZIP not found"
            ls -la
            exit 1
          fi

          mkdir -p /tmp/halaf-source
          unzip -q "$ZIP_FILE" -d /tmp/halaf-source

          SETTINGS_FILE=$(find /tmp/halaf-source -name settings.gradle.kts -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "Gradle project not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Fix Java and Kotlin versions
        run: |
          cat >> "$PROJECT_DIR/app/build.gradle.kts" <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Halaf-Launcher-v0.4-APK
          path: /tmp/halaf-source/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
